version: "3.9"

# Semantic RAG Engine — Local Development Stack
# Mappa l'architettura E-layer del documento tecnico:
#   MinIO      → E1 Object Storage
#   PostgreSQL → E4 Metadata Store
#   Redis      → Broker Celery + Status Tracker (BB4)
#   Qdrant     → E2 Vector DB
#   OpenSearch → E3 Keyword Index BM25
#   Neo4j      → C5 Knowledge Graph / E5 Hierarchical Tree Index

services:

  # ─────────────────────────────────────────────────────────────────
  # E1 — Object Storage (MinIO, S3-compatible)
  # Console web: http://localhost:9001   user: minioadmin / minioadmin
  # ─────────────────────────────────────────────────────────────────
  minio:
    image: minio/minio:latest
    container_name: rag_minio
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"   # S3 API endpoint
      - "9001:9001"   # Web console
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # Crea il bucket 'rag-documents' con struttura raw/ parsed/ artifacts/
  minio_init:
    image: minio/mc:latest
    container_name: rag_minio_init
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 ${MINIO_ROOT_USER:-minioadmin} ${MINIO_ROOT_PASSWORD:-minioadmin};
      mc mb --ignore-existing local/rag-documents;
      mc mb --ignore-existing local/rag-documents/raw;
      mc mb --ignore-existing local/rag-documents/parsed;
      mc mb --ignore-existing local/rag-documents/artifacts;
      echo '--- Bucket rag-documents creato con struttura raw/ parsed/ artifacts/ ---';
      mc ls local/rag-documents;
      "
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}

  # ─────────────────────────────────────────────────────────────────
  # E4 — Metadata Store (PostgreSQL 15)
  # ─────────────────────────────────────────────────────────────────
  postgres:
    image: postgres:15-alpine
    container_name: rag_postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-raguser}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ragpassword}
      POSTGRES_DB: ${POSTGRES_DB:-ragdb}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-raguser} -d ${POSTGRES_DB:-ragdb}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # ─────────────────────────────────────────────────────────────────
  # Broker Celery + Status Tracker BB4 (Redis 7)
  # ─────────────────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: rag_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  # ─────────────────────────────────────────────────────────────────
  # E2 — Vector DB (Qdrant)
  # Dashboard: http://localhost:6333/dashboard
  # ─────────────────────────────────────────────────────────────────
  qdrant:
    image: qdrant/qdrant:v1.10.0
    container_name: rag_qdrant
    ports:
      - "6333:6333"   # HTTP REST API
      - "6334:6334"   # gRPC
    volumes:
      - qdrant_data:/qdrant/storage
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:6333/health"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # ─────────────────────────────────────────────────────────────────
  # E3 — Keyword Index BM25 (OpenSearch 2.x)
  # Security disabilitata per dev locale — NON usare in produzione
  # ─────────────────────────────────────────────────────────────────
  opensearch:
    image: opensearchproject/opensearch:2.15.0
    container_name: rag_opensearch
    ports:
      - "9200:9200"   # HTTP API
      - "9300:9300"   # Internal transport
    environment:
      - discovery.type=single-node
      - plugins.security.disabled=true          # Dev only — no TLS/auth
      - OPENSEARCH_JAVA_OPTS=-Xms512m -Xmx512m
      - DISABLE_INSTALL_DEMO_CONFIG=true
      - bootstrap.memory_lock=true
    ulimits:
      memlock:
        soft: -1
        hard: -1
      nofile:
        soft: 65536
        hard: 65536
    volumes:
      - opensearch_data:/usr/share/opensearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:9200/_cluster/health | grep -v '\"status\":\"red\"' | grep -q 'status'"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 30s
    restart: unless-stopped

  # ─────────────────────────────────────────────────────────────────
  # C5 / E5 — Knowledge Graph (Neo4j 5.x Community)
  # Browser: http://localhost:7474   user: neo4j / ragpassword
  # ─────────────────────────────────────────────────────────────────
  neo4j:
    image: neo4j:5.20-community
    container_name: rag_neo4j
    ports:
      - "7474:7474"   # HTTP browser
      - "7687:7687"   # Bolt protocol
    environment:
      NEO4J_AUTH: ${NEO4J_USER:-neo4j}/${NEO4J_PASSWORD:-ragpassword}
      NEO4J_server_memory_heap_initial__size: 512m
      NEO4J_server_memory_heap_max__size: 1G
      NEO4J_server_memory_pagecache_size: 512m
    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:7474 || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 15
      start_period: 60s
    restart: unless-stopped

volumes:
  minio_data:
  postgres_data:
  redis_data:
  qdrant_data:
  opensearch_data:
  neo4j_data:
  neo4j_logs:
